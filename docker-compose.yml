services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    env_file:
      - .env

    networks:
      - app-network

    volumes:
      - ./app:/app/app
      - ./data:/app/data

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    restart: unless-stopped

  postgres_db:
    image: postgres:16

    environment:
      POSTGRES_USER: docker_user
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: rag_docker_db

    ports:
      - "5432:5432"   # Optional

    volumes:
      - pgdata:/var/lib/postgresql/data

    networks:
      - app-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docker_user -d rag_docker_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

networks:
  app-network: